name: Build artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check code
        run: go vet ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          artifact_name="kibana-degradation-runner-${GOOS}-${GOARCH}"
          package_directory="dist/${artifact_name}"

          mkdir -p "${package_directory}"
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "${package_directory}/kibana-degradation-runner" \
            ./cmd/kibana-degradation-runner

          cp LICENSE README.md "${package_directory}/"
          tar -C dist -czf "dist/${artifact_name}.tar.gz" "${artifact_name}"
          sha256sum "dist/${artifact_name}.tar.gz" > "dist/${artifact_name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kibana-degradation-runner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/kibana-degradation-runner-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/kibana-degradation-runner-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
