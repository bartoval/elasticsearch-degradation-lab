name: Build artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check code
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: kibana-degradation-runner-${{ matrix.goos }}-${{ matrix.goarch }}
      BINARY_NAME: kibana-degradation-runner
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          package_directory="dist/${ARTIFACT_NAME}"

          mkdir -p "${package_directory}"
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "${package_directory}/${BINARY_NAME}" \
            ./cmd/kibana-degradation-runner

          cp LICENSE README.md "${package_directory}/"
          cp -R scenarios "${package_directory}/"
          tar -C dist -czf "dist/${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
          sha256sum "dist/${ARTIFACT_NAME}.tar.gz" > "dist/${ARTIFACT_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ARTIFACT_NAME }}.tar.gz
            dist/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
