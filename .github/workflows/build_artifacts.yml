name: Build artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check code
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: kibana-scenario-runner-${{ matrix.goos }}-${{ matrix.goarch }}
      BINARY_NAME: kibana-scenario-runner
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          package_directory="dist/${ARTIFACT_NAME}"

          mkdir -p "${package_directory}"
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "${package_directory}/${BINARY_NAME}" \
            ./cmd/kibana-scenario-runner

          cp DESIGN.md LICENSE README.md "${package_directory}/"
          mkdir -p "${package_directory}/scenarios"
          cp scenarios/*.yml scenarios/README.md "${package_directory}/scenarios/"
          tar -C dist -czf "dist/${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
          cd dist
          sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ARTIFACT_NAME }}.tar.gz
            dist/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: kibana-scenario-runner-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
