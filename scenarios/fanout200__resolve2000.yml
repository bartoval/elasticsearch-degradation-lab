# INFRA: 200 CCS aliases and 2000 remote data streams, with no network fault.
# Each stream has one custom field so source resolution grows without also making
# field capabilities the dominant workload.
#
# USE CASES:
#   - Middle point in the 100/200/400 alias source-resolution sweep
#   - Measuring the natural cost of /internal/esql/autocomplete/sources/all
#   - Checking whether duration grows with the cluster-qualified response

version: 1
id: fanout200_resolve2000
name: Fan-out 200, resolve 2000 streams

topology:
  remotes:
    - id: remote-1
      alias: serverless-logging
      aliasCount: 200
      skipUnavailable: true

fixtures:
  - target: remote-1
    preset: bulk_logs
    name: logs-resolution
    dataStreams: 2000
    fieldsPerStream: 1

faults: []
