# Measures how ES|QL source discovery scales with the number of CCS aliases.
# This is the resolve-heavy half of the overview-cluster problem: the endpoint
# /internal/esql/autocomplete/sources/all calls _resolve/index for local and remote
# sources, and remote results are namespaced by cluster alias.
#
# The fixture deliberately has one field per stream. This keeps _field_caps small
# while _resolve/index still returns every data stream and backing index. There are
# no network faults, so the measurement belongs to the source-resolution path
# rather than to a chosen latency or bandwidth limit.
#
# Run the scenario with aliasCount set to 100, 200, and 400. For every run record
# the status, duration, and response size of:
#
#   http://localhost:5601/.../internal/esql/autocomplete/sources/all
#
# Also measure _resolve/index through port 9210 when the Elasticsearch operation
# needs to be separated from Kibana's HTTP processing. Kibana development instances
# use a 30-second Elasticsearch timeout by default; use 120s while running this
# sweep so results above 30 seconds can complete.

version: 1
id: overview_sources_resolution
name: Overview sources resolution

topology:
  remotes:
    - id: remote-1
      alias: serverless-logging
      aliasCount: 100
      skipUnavailable: true

fixtures:
  # Two thousand streams produce source metadata without approaching the current
  # snapshot's 5000-shard-per-node limit. Creation can still take several minutes
  # because every data stream requires a cluster-state update.
  - target: remote-1
    preset: bulk_logs
    name: logs-resolution
    dataStreams: 2000
    fieldsPerStream: 1
  # Keeps Discover available for a local-only comparison.
  - target: coordinator
    preset: minimal_logs
    name: logs-degradation-default

faults: []
