# Example scenario that describes a slow CCS remote cluster.
# It groups the required cluster topology, test data, and network degradations.
# Copy this file as a starting point when creating another scenario.

version: 1
id: ccs_slow_remote
name: Slow CCS remote

# Describes one physical remote and its single CCS alias.
topology:
  remotes:
    - id: remote-1
      alias: remote-1
      skipUnavailable: true

# Describes zero or more test-data fixtures, including their generated resource names.
fixtures:
  - target: remote-1
    preset: minimal_logs
    name: logs-degradation-default
  - target: coordinator
    preset: minimal_lookup
    name: degradation-lookup

# Describes zero or more network degradations to apply after the clusters are ready.
faults:
  - id: remote-1-latency
    target: remote-1
    type: latency
    latencyMs: 25000
    jitterMs: 0
