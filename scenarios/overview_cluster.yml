# Reproduces the Elastic "overview cluster" environment described in
# kibana#281180, the analysis of which produced the discover:defaultEsqlQuery
# setting (kibana#281319).
#
# The reported environment: an Observability deployment cross-cluster connected to
# 100+ remotes (60 regions x 2 clusters), with observability:logSources set to a
# very broad pattern. Opening Discover ran a heavy default ES|QL query across every
# remote, /internal/esql/autocomplete/sources/all took ~57s, and the browser tab
# grew to 3.5GB.
#
# The alias prefix is deliberately serverless-logging, so the reported source
# pattern "serverless-logging-*:logs-*" matches all 100 generated aliases exactly
# as it does on the real deployment.
#
# APPLY THESE KIBANA SETTINGS, in a space using the Observability solution view.
# Without them Discover will not choose the broad default query and the scenario
# reproduces nothing:
#
#   observability:logSources   logs-*-*,logs-*,filebeat-*,serverless-logging-*:logs-*
#   discover:searchOnPageLoad  on
#
# Then open Discover in ES|QL mode and watch, in the network tab,
# /internal/esql/autocomplete/sources/all together with the tab's memory use.
#
# The setting under test, available in 9.6.0+, overrides only the default query:
#
#   discover:defaultEsqlQuery  FROM logs-degradation-default
#
# Expect the heavy default query to disappear and the autocomplete request to
# remain, because that route resolves ['*', '*:*'] unconditionally and reads no
# advanced setting.
#
# Field capabilities are set by the fixture alone, NOT by the alias count. Measured
# on this scenario, over 200 streams of 300 fields:
#
#   1 alias    60019 fields   7.8 MB
#   100 alias  60019 fields   9.0 MB
#
# _field_caps merges by field name, and every alias resolves to the same physical
# remote, so a hundred of them contribute exactly the names one does. Even the bytes
# barely move, because the weight is in the field definitions rather than in the
# per-field index lists. Raising aliasCount will not make this heavier; raising
# dataStreams x fieldsPerStream will, at the cost of heap on the remote.
#
# Index resolution is the opposite case: _resolve/index namespaces its entries per
# cluster, so there the aliases really do add up. Keep the two apart when reading a
# measurement, since one endpoint answers to the alias count and the other does not.

version: 1
id: overview_cluster
name: Overview cluster

topology:
  remotes:
    - id: remote-1
      alias: serverless-logging
      aliasCount: 100
      skipUnavailable: true

fixtures:
  # 200 data streams behind 100 aliases resolve to roughly 40000 entries, since
  # _resolve/index returns each data stream together with its backing index. That
  # is enough for the source patterns to be realistic; it is not what makes the
  # environment slow.
  - target: remote-1
    preset: bulk_logs
    name: logs-fanout
    dataStreams: 200
    fieldsPerStream: 300
  # The local-only target for discover:defaultEsqlQuery to point at.
  - target: coordinator
    preset: minimal_logs
    name: logs-degradation-default

# Two faults, because they answer different questions and only one of them is
# tied to what the fixture builds.
#
# A latency fault costs the same whether the answer is one field or sixty thousand,
# so a large latency produces a large number that says nothing about the topology:
# raise fieldsPerStream and it does not move. It belongs here only as the round trip
# to a distant region, which is genuinely independent of size.
#
# A bandwidth fault costs in proportion to the bytes. Since the bytes are what the
# fixture produces, the time a request takes becomes a measurement of it. That is
# the number worth reporting.
#
# Both are diluted the same way by parallelism: cross-cluster fan-out is concurrent,
# so the coordinator waits for the slowest alias rather than the sum of all of them.
# What separates the two is the derivative, not the magnitude.
faults:
  # Round trip to a distant region. This costs the same whatever the answer
  # weighs, so it is kept small: it is not what this scenario is about.
  - id: region-round-trip
    target: remote-1
    type: latency
    latencyMs: 150
    jitterMs: 100
  # Throughput of that same link, which is what makes the answer's SIZE cost
  # something, and so ties the measurement to the fixture rather than to a chosen
  # constant.
  #
  # NOT YET CALIBRATED. This rate charges for bytes on the cross-cluster transport,
  # which is binary and may be compressed, while the number you see is the JSON the
  # coordinator assembles: 7.8 MB of answer took 65s here, which 50 KB/s explains
  # only if roughly 3 MB actually crossed the wire. Read the byte counters at
  # http://127.0.0.1:8474/metrics before and after a request and divide by the rate
  # before quoting any timing from this scenario.
  - id: region-throughput
    target: remote-1
    type: bandwidth
    rateKbps: 50
