# Reproduces the Elastic "overview cluster" environment described in
# kibana#281180, the analysis of which produced the discover:defaultEsqlQuery
# setting (kibana#281319).
#
# The reported environment: an Observability deployment cross-cluster connected to
# 100+ remotes (60 regions x 2 clusters), with observability:logSources set to a
# very broad pattern. Opening Discover ran a heavy default ES|QL query across every
# remote, /internal/esql/autocomplete/sources/all took ~57s, and the browser tab
# grew to 3.5GB.
#
# The alias prefix is deliberately serverless-logging, so the reported source
# pattern "serverless-logging-*:logs-*" matches all 100 generated aliases exactly
# as it does on the real deployment.
#
# APPLY THESE KIBANA SETTINGS, in a space using the Observability solution view.
# Without them Discover will not choose the broad default query and the scenario
# reproduces nothing:
#
#   observability:logSources   logs-*-*,logs-*,filebeat-*,serverless-logging-*:logs-*
#   discover:searchOnPageLoad  on
#
# Then open Discover in ES|QL mode and watch, in the network tab,
# /internal/esql/autocomplete/sources/all together with the tab's memory use.
#
# The setting under test, available in 9.6.0+, overrides only the default query:
#
#   discover:defaultEsqlQuery  FROM logs-degradation-default
#
# Expect the heavy default query to disappear and the autocomplete request to
# remain, because that route resolves ['*', '*:*'] unconditionally and reads no
# advanced setting.
#
# The topology models tail latency rather than making every region uniformly slow:
# 99 aliases remain healthy and one takes 25 seconds to respond. A CCS operation
# waits for that slowest alias, while a coordinator-only query avoids it entirely.
# The delay stays below Kibana's default 30-second Elasticsearch timeout so the
# request completes and can be distinguished from a timeout error.

version: 1
id: overview_cluster
name: Overview cluster

topology:
  remotes:
    - id: remote-1
      alias: serverless-logging
      aliasCount: 100
      skipUnavailable: true

fixtures:
  # Fifty streams behind 100 aliases produce 5000 remote source names. This stays
  # below the Streams enrichment API's 10000-name limit, while still exercising a
  # broad source list. One field keeps _field_caps small enough that the chosen
  # tail latency remains the degradation being observed.
  - target: remote-1
    preset: bulk_logs
    name: logs-fanout
    dataStreams: 50
    fieldsPerStream: 1
  # The local-only target for discover:defaultEsqlQuery to point at.
  - target: coordinator
    preset: minimal_logs
    name: logs-degradation-default

faults:
  # Positions are 1-based. Only serverless-logging-100 receives this toxic; the
  # other 99 aliases continue to respond normally.
  - id: slowest-region
    target: remote-1
    aliasPosition: 100
    type: latency
    latencyMs: 25000
    jitterMs: 0
