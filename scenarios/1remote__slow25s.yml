# INFRA: one CCS remote, 25s latency on every cross-cluster request.
#
# USE CASES (pick any):
#   - Cross-cluster query cancellation and loading behaviour
#   - Reporting or CSV export over a slow remote
#   - Agent Builder index-mapping tools on remote data streams
#   - Smoke test for CCS FTR/Scout migrations
#
# Copy this file as a starting point when creating another scenario.

version: 1
id: 1remote_slow25s
name: 1 remote, 25s latency

topology:
  remotes:
    - id: remote-1
      alias: remote-1
      skipUnavailable: true

fixtures:
  - target: remote-1
    preset: minimal_logs
    name: logs-degradation-default
  - target: coordinator
    preset: minimal_lookup
    name: degradation-lookup

faults:
  - id: remote-1-latency
    target: remote-1
    type: latency
    latencyMs: 25000
    jitterMs: 0
