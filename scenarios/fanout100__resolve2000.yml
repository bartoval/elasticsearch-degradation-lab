# INFRA: 100 CCS aliases and 2000 remote data streams, with no network fault.
# Each stream has one custom field so source resolution grows without also making
# field capabilities the dominant workload.
#
# USE CASES:
#   - First point in the 100/200/400 alias source-resolution sweep
#   - Measuring the natural cost of /internal/esql/autocomplete/sources/all
#   - Comparing response duration and size without injected latency
#
# Run the matching fanout200 and fanout400 profiles to see whether duration follows
# the number of cluster-qualified results.

version: 1
id: fanout100_resolve2000
name: Fan-out 100, resolve 2000 streams

topology:
  remotes:
    - id: remote-1
      alias: serverless-logging
      aliasCount: 100
      skipUnavailable: true

fixtures:
  - target: remote-1
    preset: bulk_logs
    name: logs-resolution
    dataStreams: 2000
    fieldsPerStream: 1

faults: []
